name: Prime ERP CI

on:
  push:
    branches: [main, develop, feat/**]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps (pnpm)
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      # Fallback for legacy npm-only runners / missing pnpm-lock: ensure npm still works if pnpm fails
      - name: Verify frontend lockfile (debug)
        if: failure()
        run: ls -la frontend/ backend/ pnpm-lock.yaml || true

  backend-tests:
    name: Backend Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules
        working-directory: ./backend
        run: npm rebuild sqlite3

      - name: Run tests
        working-directory: ./backend
        run: npm test
        env:
          JWT_SECRET: test-secret
          SESSION_SECRET: test-session-secret
          ENCRYPTION_KEY: test-encryption-key-32chars!!

  frontend-tests:
    name: Frontend Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ./frontend
        run: npm test
        env:
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''

  build:
    name: Build Artifacts
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: |
            backend/
            !backend/node_modules/
            !backend/tests/
          retention-days: 7

  docker-build:
    name: Docker Build Check
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t prime-erp-backend ./backend

      - name: Build frontend image
        run: docker build -t prime-erp-frontend ./frontend

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy to production
        run: |
          echo "Deployment would be configured here"
          echo "Example: docker compose -f docker-compose.yml up -d --build"
          echo "Or: netlify deploy --prod --dir=frontend/dist"
