services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    ports: ["3000:3000"]
    environment: { NODE_ENV: production, PORT: 3000, JWT_SECRET: ${JWT_SECRET}, SESSION_SECRET: ${SESSION_SECRET}, ENCRYPTION_KEY: ${ENCRYPTION_KEY}, RATE_LIMIT_WINDOW_MS: 900000, RATE_LIMIT_MAX: 200 }
    volumes: [prime-erp-data:/app/data]
    restart: unless-stopped
    healthcheck: { test: ["CMD","node","-e","require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"], interval: 30s, timeout: 3s, retries: 3, start_period: 10s }

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports: ["80:80"]
    depends_on: { backend: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  prime-erp-data:
